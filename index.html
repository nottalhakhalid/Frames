<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Frames – Image Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="wrap">
      <h1>Frames</h1>
      <p class="sub">
        A small gallery of generated artwork. Add your own photos and they show
        up under Mine – drag them anywhere on the page.
      </p>
      <div class="bar">
        <input
          type="search"
          id="q"
          placeholder="Search by title"
          aria-label="Search by title"
        />
        <button class="btn" id="up">Add images</button>
        <input type="file" id="file" accept="image/*" multiple hidden />
        <select id="sort" aria-label="Sort images">
          <option value="def">Default order</option>
          <option value="az">Title A–Z</option>
          <option value="za">Title Z–A</option>
          <option value="fav">Favorites first</option>
        </select>
        <button class="chip" id="theme">Toggle theme</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="tools">
        <label
          >Size
          <input
            type="range"
            id="size"
            min="140"
            max="360"
            value="230" /></label
        ><span id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        No images match. Clear the search or add your own.
      </div>
    </div>

    <div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button class="lbb" id="x" aria-label="Close">✕</button>
      <button class="lbb" id="lf" aria-label="Favorite" aria-pressed="false">
        ♡
      </button>
      <button class="lbb" id="rm" hidden>Remove</button>
      <button
        class="lbb"
        id="pl"
        aria-label="Toggle slideshow"
        aria-pressed="false"
      >
        ▶
      </button>
      <button class="lbb" id="pv" aria-label="Previous image">‹</button>
      <button class="lbb" id="nx" aria-label="Next image">›</button>
      <img id="big" alt="" />
      <div id="cap"></div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
